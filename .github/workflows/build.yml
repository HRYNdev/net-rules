name: build rule-sets

on:
  push:
    branches: [ main ]
    paths: [ 'src/**' ]
  workflow_dispatch:
  schedule:
    # раз в сутки, чтобы релиз latest не устаревал даже без правок
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить sing-box (нужен только компилятор наборов)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Берём не "последний тег", а последний релиз, в котором РЕАЛЬНО лежит сборка
          # под linux-amd64, и ссылку берём из самого релиза, а не склеиваем из номера.
          # 09.08.2026 latest указал на v1.13.17 - релиз только с APK для андроида,
          # ядра там нет, склеенная ссылка вела в никуда, curl молча клал страницу
          # "Not Found" (9 байт) в файл и выходил с кодом 0, а падало всё на распаковке.
          # Флаг prerelease не спасает: ту же неделю бета 1.14.0-beta.11 висела с
          # prerelease=false и была бы "последней версией", поэтому отсекаем и по имени тега.
          # Спрашиваем API С ТОКЕНОМ. Без него счёт идёт по адресу раннера, общему на всех,
          # и 10.08.2026 сборка получила 403 на ровном месте: чужие прогоны выбрали лимит.
          # С токеном лимит свой и на порядок выше.
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            'https://api.github.com/repos/SagerNet/sing-box/releases?per_page=30' -o /tmp/sb-rel.json
          python3 - > /tmp/sb.env <<'PY'
          import json, re, sys
          for r in json.load(open('/tmp/sb-rel.json')):
              if r['draft'] or r['prerelease'] or re.search(r'alpha|beta|rc', r['tag_name'], re.I):
                  continue
              for a in r['assets']:
                  m = re.fullmatch(r'sing-box-(.+)-linux-amd64\.tar\.gz', a['name'])
                  if m:
                      print('VER=' + m.group(1))
                      print('URL=' + a['browser_download_url'])
                      sys.exit(0)
          sys.exit('среди 30 последних релизов sing-box нет сборки под linux-amd64')
          PY
          . /tmp/sb.env
          echo "sing-box версия: $VER"
          # -f обязателен: без него curl молча кладёт страницу ошибки в файл и выходит с нулём.
          curl -fsSL -o sb.tar.gz "$URL"
          tar -xzf sb.tar.gz --strip-components=1 -C /usr/local/bin "sing-box-${VER}-linux-amd64/sing-box"
          sing-box version

      - name: Собрать наборы
        run: |
          set -e
          mkdir -p dist

          to_json_domains() {
            python3 - "$1" > "$2" <<'PY'
          import json, sys
          items = []
          for line in open(sys.argv[1], encoding='utf-8'):
              s = line.strip()
              if s and not s.startswith('#'):
                  items.append(s)
          json.dump({"version": 3, "rules": [{"domain_suffix": sorted(set(items))}]},
                    sys.stdout, ensure_ascii=False, indent=1)
          PY
          }

          to_json_subnets() {
            python3 - "$1" > "$2" <<'PY'
          import json, sys
          items = []
          for line in open(sys.argv[1], encoding='utf-8'):
              s = line.strip()
              if s and not s.startswith('#'):
                  items.append(s)
          json.dump({"version": 3, "rules": [{"ip_cidr": sorted(set(items))}]},
                    sys.stdout, ensure_ascii=False, indent=1)
          PY
          }

          for f in src/*-domains.lst; do
            n=$(basename "$f" .lst)
            to_json_domains "$f" "dist/$n.json"
            sing-box rule-set compile --output "dist/$n.srs" "dist/$n.json"
            echo "$n: $(grep -cve '^\s*$' "$f") записей -> $(stat -c%s "dist/$n.srs") байт"
          done

          for f in src/*-subnets.lst; do
            n=$(basename "$f" .lst)
            to_json_subnets "$f" "dist/$n.json"
            sing-box rule-set compile --output "dist/$n.srs" "dist/$n.json"
            echo "$n: $(grep -cve '^\s*$' "$f") записей -> $(stat -c%s "dist/$n.srs") байт"
          done

      - name: Собрать рекламный набор
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Списки в формате AdGuard, sing-box умеет их конвертировать напрямую.
          # Это то же, что фильтрует AdGuard дома, но применимо на любом устройстве.
          #
          # Источников ДВА, и это разные хозяева, а не зеркала одного: 10.08.2026 с
          # GitHub исчез весь аккаунт hagezi (репозиторий, релизы, jsDelivr - всё 404),
          # и одна мёртвая ссылка остановила ВЕСЬ релиз вместе с маршрутами Телеграма,
          # которые к рекламе отношения не имеют.
          ADS_SRC=""
          for u in \
            "https://small.oisd.nl/abp" \
            "https://raw.githubusercontent.com/sjhgvr/oisd/main/abp_small.txt" ; do
            if ! curl -sfL --max-time 120 -o /tmp/ads-src.txt "$u"; then
              echo "ПРОПУСК: $u не ответил"
              continue
            fi
            # Пустой или обрезанный ответ - это не источник, а тишина, которую легко
            # принять за "рекламы стало меньше". Порог с запасом: на 10.08.2026 в
            # списке 57 033 правила.
            n=$(grep -c '^||' /tmp/ads-src.txt || true)
            if [ "$n" -lt 20000 ]; then
              echo "ПРОПУСК: $u отдал $n правил - на список не похоже"
              continue
            fi
            ADS_SRC="$u"; echo "источник: $u, правил $n"; break
          done

          if [ -z "$ADS_SRC" ]; then
            # Ни один источник не ответил. Весь релиз из-за этого не роняем: без него
            # у пользователя перестаёт обновляться тоннель, а это хуже вчерашней рекламы.
            # Берём ads.srs из прошлого релиза - но НЕ бесконечно: через 7 суток
            # молчания это уже не заминка, а тихо протухший набор.
            echo "::warning::источники рекламного списка недоступны, беру ads.srs из релиза latest"
            gh release download latest --pattern ads.srs --dir dist --clobber
            upd=$(gh api "repos/${{ github.repository }}/releases/tags/latest" \
                  --jq '.assets[] | select(.name=="ads.srs") | .updated_at')
            age=$(( ( $(date -u +%s) - $(date -u -d "$upd" +%s) ) / 86400 ))
            echo "прошлый ads.srs собран $upd, это $age сут назад"
            if [ "$age" -ge 7 ]; then
              echo "::error::рекламный набор не обновлялся $age сут, а источники всё молчат - это уже поломка, а не заминка"
              exit 1
            fi
            echo "ADS_FALLBACK=$age" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "исходник: $(grep -c . /tmp/ads-src.txt) строк"

          # свои правила поверх: то, что мы находили руками и чего нет в общем списке
          cat src/ads-extra.txt >> /tmp/ads-src.txt 2>/dev/null || true

          # белый список: вырезаем блокировки того, что ломает нужные сервисы.
          # Общие списки временами кладут туда боевые домены (gvt2.com у Google Play),
          # и один такой домен выглядит как "интернет сломался", а не как "реклама режется".
          python3 - <<'PY'
          import re, os
          path = 'src/ads-allow.txt'
          allow = set()
          if os.path.exists(path):
              for line in open(path, encoding='utf-8'):
                  s = line.strip().lower()
                  if s and not s.startswith(('#', '!')):
                      allow.add(s)
          lines = open('/tmp/ads-src.txt', encoding='utf-8').read().splitlines()
          keep, dropped = [], []
          for line in lines:
              m = re.match(r'^\|\|([^\^/\$]+)\^?', line.strip())
              d = m.group(1).lower() if m else None
              if d and any(d == a or d.endswith('.' + a) for a in allow):
                  dropped.append(line.strip())
              else:
                  keep.append(line)
          open('/tmp/ads-src.txt', 'w', encoding='utf-8').write('\n'.join(keep) + '\n')
          print(f'белый список: {len(allow)} доменов, вырезано правил {len(dropped)}')
          for l in dropped:
              print('  снято:', l)
          PY

          sing-box rule-set convert --type adguard --output dist/ads.srs /tmp/ads-src.txt
          echo "ads.srs: $(stat -c%s dist/ads.srs) байт"

      - name: Собрать набор заблокированного в РФ
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Зачем: свой список это 256 доменов, руками догонять блокировки бессмысленно.
          # Реестр даёт разом десятки тысяч имён, и «занести в прокси всё что может
          # пригодиться» перестаёт быть ручной работой.
          #
          # ПОЧЕМУ БЕРЁМ ВЕСЬ РЕЕСТР, А НЕ ТОП. Разбор 13.08.2026 предлагал три объёма:
          # весь (81 061 домен, 505 КБ), топ-1М (6521, 41 КБ), топ-100k (1833, 11 КБ).
          # Взят весь, потому что ломается как раз хвост: на выборке 50 хостов 12.08 висели
          # opensource.com, illumos.org, ieee802.org, reactos.org — их нет ни в одном топе,
          # и ни один урезанный вариант их бы не поймал. Вес рядом с ads.srs (448 КБ) не
          # разница, а мёртвые домены в наборе не срабатывают вовсе — они не стоят ничего.
          #
          # Стоп-лист и вычет рекламы ниже — не косметика: чужой источник мы не контролируем,
          # а домен, попавший одновременно в маршрут и в reject, молча отвергается (reject
          # стоит выше маршрута), и снаружи это выглядит как «сайт не работает».
          SRC=https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/domains_all.lst
          if ! curl -fsSL -m 120 "$SRC" -o /tmp/blocked-src.lst; then
            echo "::warning::реестр заблокированного недоступен, беру набор из релиза latest"
            gh release download latest --pattern blocked-domains.srs --dir dist --clobber
            exit 0
          fi

          # Тишина вместо списка — это не «блокировок стало меньше». Порог с запасом:
          # на 13.08.2026 в источнике 81 061 домен.
          n=$(grep -cve '^\s*$' /tmp/blocked-src.lst)
          if [ "$n" -lt 50000 ]; then
            echo "::warning::реестр отдал $n строк — на список не похоже, беру набор из релиза latest"
            gh release download latest --pattern blocked-domains.srs --dir dist --clobber
            exit 0
          fi

          # Наши сервисы не должны уезжать в туннель никогда. На 13.08.2026 в источнике их
          # нет ни одного, но это свойство чужого файла, а не наша гарантия.
          cat > /tmp/blocked-stop.txt <<'STOP'
          sberbank.ru
          sbrf.ru
          gosuslugi.ru
          nalog.ru
          mos.ru
          vtb.ru
          tinkoff.ru
          tbank.ru
          alfabank.ru
          gazprombank.ru
          psbank.ru
          raiffeisen.ru
          sovcombank.ru
          rshb.ru
          open.ru
          mkb.ru
          yoomoney.ru
          qiwi.com
          nspk.ru
          ozon.ru
          wildberries.ru
          avito.ru
          dns-shop.ru
          mvideo.ru
          citilink.ru
          lamoda.ru
          mts.ru
          megafon.ru
          beeline.ru
          tele2.ru
          rt.ru
          yandex.ru
          ya.ru
          mail.ru
          vk.com
          ok.ru
          hh.ru
          2gis.ru
          STOP

          # Рекламный исходник может отсутствовать (шаг выше ушёл на запасной набор) —
          # тогда вычет рекламы просто не делаем, а не роняем сборку.
          ADS_FILE=/tmp/ads-src.txt
          [ -f "$ADS_FILE" ] || ADS_FILE=""

          ADS_FILE="$ADS_FILE" python3 - /tmp/blocked-src.lst /tmp/blocked-stop.txt > dist/blocked-domains.json <<'PY'
          import json, os, re, sys

          stop = {l.strip() for l in open(sys.argv[2], encoding='utf-8') if l.strip()}

          # Домены, которые режет наш же ads-набор. Гнать их в туннель бессмысленно:
          # reject стоит выше маршрута, они всё равно отвергаются, а место в наборе занимают.
          ads = set()
          ads_path = os.environ.get('ADS_FILE') or ''
          if ads_path and os.path.exists(ads_path):
              for line in open(ads_path, encoding='utf-8'):
                  m = re.match(r'^\|\|([^\^/$]+)\^', line.strip())
                  if m:
                      ads.add(m.group(1).lower())

          def pokryt(d, mnozhestvo):
              """d или любой его родительский домен есть в множестве."""
              chasti = d.split('.')
              return any('.'.join(chasti[i:]) in mnozhestvo for i in range(len(chasti)))

          syroe = []
          for line in open(sys.argv[1], encoding='utf-8'):
              s = line.strip().lower().rstrip('.')
              if not s or s.startswith('#') or '.' not in s:
                  continue
              syroe.append(s)

          vsego = len(syroe)
          bez_stop = [d for d in syroe if not pokryt(d, stop)]
          snyato_stop = vsego - len(bez_stop)

          bez_ads = [d for d in bez_stop if not pokryt(d, ads)] if ads else bez_stop
          snyato_ads = len(bez_stop) - len(bez_ads)

          # Схлопывание: правило domain_suffix покрывает и поддомены, поэтому при живом
          # апексе поддомен в наборе — чистый вес без охвата.
          nabor = set(bez_ads)
          itog = sorted(d for d in nabor
                        if not any('.'.join(d.split('.')[i:]) in nabor
                                   for i in range(1, len(d.split('.')))))
          snyato_izb = len(bez_ads) - len(itog)

          if len(itog) < 30000:
              sys.exit(f'после фильтров осталось {len(itog)} доменов — на реестр не похоже, не выпускаю')

          # Контроль в обе стороны: то, что ломалось у Вовы, обязано попасть; то, что
          # обязано ходить напрямую, — не попасть ни в каком виде.
          dolzhny = ['proton.me', 'rumble.com', 'bsky.app', 'messenger.com', 'archive.is']
          zapreweny = ['sberbank.ru', 'gosuslugi.ru', 'ozon.ru', 'wildberries.ru', 'ya.ru']
          v_nabore = set(itog)
          net = [d for d in dolzhny if not pokryt(d, v_nabore)]
          lishnie = [d for d in zapreweny if pokryt(d, v_nabore)]
          if net:
              sys.exit('контроль: в набор НЕ попали ' + ', '.join(net))
          if lishnie:
              sys.exit('контроль: в набор попало запрещённое ' + ', '.join(lishnie))

          print(f'реестр: {vsego} в источнике, снято по стоп-листу {snyato_stop}, '
                f'по рекламе {snyato_ads}, избыточных поддоменов {snyato_izb} '
                f'-> в наборе {len(itog)}', file=sys.stderr)

          json.dump({"version": 3, "rules": [{"domain_suffix": itog}]},
                    sys.stdout, ensure_ascii=False)
          PY

          sing-box rule-set compile --output dist/blocked-domains.srs dist/blocked-domains.json
          echo "blocked-domains.srs: $(stat -c%s dist/blocked-domains.srs) байт"

      - name: Маршрут против рекламы (домен нельзя одновременно гнать и резать)
        run: |
          if [ -n "$ADS_FALLBACK" ]; then
            # Исходника нет - набор взят готовым из прошлого релиза. Проверку он уже
            # проходил, когда собирался; молча пропускать всё равно нельзя.
            echo "::warning::ads.srs из прошлого релиза ($ADS_FALLBACK сут), исходника нет - проверку конфликтов пропускаю"
            exit 0
          fi
          python3 tools/check-route-conflict.py /tmp/ads-src.txt

      - name: Проверить наборы
        run: |
          set -e
          # Обычные наборы проверяем обратной декомпиляцией И СВЕРКОЙ С ИСХОДНИКОМ.
          # Считать правила бесполезно: все домены лежат в ОДНОМ правиле, поэтому
          # прежняя строка печатала "правил 1" и на полном наборе, и на пустом.
          # Пустой набор (17 байт) уезжал бы в релиз latest, роутер и телефоны забрали
          # бы его по расписанию, и наружу это выглядит как "всё пошло мимо туннеля".
          # Считать записи числом тоже нельзя: sing-box законно склеивает соседние
          # подсети (2001:b28:f23c::/48 + f23d::/48 -> f23c::/47), охват не меняется.
          # Поэтому проверяем ПОКРЫТИЕ: каждая строка исходника обязана попадать в набор.
          for f in dist/main-*.srs; do
            sing-box rule-set decompile --output /tmp/check.json "$f"
            SRC="src/$(basename "$f" .srs).lst" python3 - <<'PY'
          import ipaddress, json, os, sys

          src = []
          for line in open(os.environ['SRC'], encoding='utf-8'):
              t = line.strip()
              if t and not t.startswith('#'):
                  src.append(t)

          suffixes, nets = [], []
          for r in json.load(open('/tmp/check.json')).get('rules', []):
              suffixes += r.get('domain_suffix', [])
              nets += [ipaddress.ip_network(c) for c in r.get('ip_cidr', [])]

          if not suffixes and not nets:
              sys.exit(f'{os.environ["SRC"]}: НАБОР ПУСТ - в него не попало ни одной записи')

          lost = []
          for item in src:
              if '/' in item:
                  n = ipaddress.ip_network(item)
                  ok = any(n.version == m.version and n.subnet_of(m) for m in nets)
              else:
                  ok = any(item == s or item.endswith('.' + s) for s in suffixes)
              if not ok:
                  lost.append(item)

          if lost:
              sys.exit(f'{os.environ["SRC"]}: в набор НЕ попали {len(lost)} записей: ' + ', '.join(lost[:10]))
          print(f'{os.environ["SRC"]}: покрыты все {len(src)} записей '
                f'(в наборе доменов {len(suffixes)}, подсетей {len(nets)})')
          PY
          done

          # Рекламный набор собран из AdGuard-формата и обратно не разбирается -
          # проверяем тем, что sing-box принимает его в живом конфиге.
          cat > /tmp/t.json <<'EOF'
          {
            "log": {"level": "error"},
            "inbounds": [{"type": "socks", "listen": "127.0.0.1", "listen_port": 11999}],
            "outbounds": [{"type": "direct", "tag": "d"}],
            "route": {
              "rules": [{"rule_set": ["ads"], "action": "reject"}],
              "rule_set": [{"type": "local", "tag": "ads", "format": "binary", "path": "PLACEHOLDER"}],
              "final": "d"
            }
          }
          EOF
          sed -i "s|PLACEHOLDER|$(pwd)/dist/ads.srs|" /tmp/t.json
          sing-box check -c /tmp/t.json
          echo "ads.srs: принят sing-box, $(stat -c%s dist/ads.srs) байт"

      - name: Обновить релиз latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NOTE=""
          if [ -n "$ADS_FALLBACK" ]; then
            # Тот же самый файл заливать обратно НЕЛЬЗЯ: upload обновит ему дату, срок
            # годности из шага сборки обнулится на каждом прогоне и не наступит никогда.
            # Он и так лежит в релизе - просто не трогаем его.
            rm -f dist/ads.srs
            NOTE=$'\n\nВНИМАНИЕ: рекламный набор не обновлялся, источники молчат. '
            NOTE="$NOTE""ads.srs в релизе прежний, ему $ADS_FALLBACK сут."
          fi
          # Релиз НЕ удаляем: между удалением и созданием файлы недоступны,
          # и потребители в этот момент получают 404. Обновляем файлы на месте.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/*.srs dist/*.json --clobber
            gh release edit latest --notes "Обновлено $(date -u '+%Y-%m-%d %H:%M UTC') из src/$NOTE"
            echo "релиз обновлён без окна недоступности"
          else
            gh release create latest dist/*.srs dist/*.json \
              --title "latest" \
              --notes "Собрано $(date -u '+%Y-%m-%d %H:%M UTC') из src/"
            echo "релиз создан"
          fi

      - name: Убедиться, что файлы реально отдаются
        run: |
          set -e
          for f in main-domains.srs main-subnets.srs; do
            for i in 1 2 3 4 5; do
              code=$(curl -sL -o /tmp/$f -w '%{http_code}' \
                "https://github.com/${{ github.repository }}/releases/latest/download/$f")
              if [ "$code" = "200" ] && [ -s /tmp/$f ]; then
                echo "$f: отдаётся, $(stat -c%s /tmp/$f) байт"
                break
              fi
              [ $i -eq 5 ] && { echo "$f: НЕ ОТДАЁТСЯ после 5 попыток"; exit 1; }
              sleep 5
            done
          done

      # Предыдущий шаг проверяет github.com, а роутер и телефоны качают с subkv -
      # это разные двери, и зелёный на первой ничего не говорит о второй.
      # Синхронизатор на VPS ходит раз в 20 минут, поэтому не сверяем мгновенно,
      # а ждём: файл у пользователя обязан стать тем же, что мы только что собрали.
      - name: Дождаться, пока правила доедут до пользователя (subkv)
        timeout-minutes: 30
        run: |
          set -e
          BASE="https://subkv.chickenkiller.com/rules"
          FILES="main-domains.srs main-subnets.srs ads.srs blocked-domains.srs"
          # В режиме запасного набора ads.srs в релиз не заливался и из dist убран -
          # сверять его нечем и не с чем, он там прежний и доехал ещё в прошлый раз.
          if [ -n "$ADS_FALLBACK" ]; then
            FILES="main-domains.srs main-subnets.srs blocked-domains.srs"
            echo "ads.srs пропускаю: набор прежний, релиз его не обновлял"
          fi
          for f in $FILES; do
            want=$(sha256sum "dist/$f" | cut -d' ' -f1)
            for i in $(seq 1 27); do
              code=$(curl -sL -o "/tmp/pub-$f" -w '%{http_code}' --max-time 30 "$BASE/$f" || echo 000)
              got=$(sha256sum "/tmp/pub-$f" 2>/dev/null | cut -d' ' -f1)
              if [ "$code" = "200" ] && [ "$want" = "$got" ]; then
                echo "$f: доехал до subkv ($(stat -c%s /tmp/pub-$f) байт, ждали $((i-1)) мин)"
                break
              fi
              if [ "$i" -eq 27 ]; then
                echo "$f: за 26 минут НЕ доехал до subkv (код $code)."
                echo "  ждали sha256 $want, лежит $got"
                echo "  смотреть /opt/sync-rules.sh на VPS - при неудаче он молча оставляет прежнее"
                exit 1
              fi
              sleep 60
            done
          done
