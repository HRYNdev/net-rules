name: build rule-sets

on:
  push:
    branches: [ main ]
    paths: [ 'src/**' ]
  workflow_dispatch:
  schedule:
    # раз в сутки, чтобы релиз latest не устаревал даже без правок
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Поставить sing-box (нужен только компилятор наборов)
        run: |
          set -e
          # Берём не "последний тег", а последний релиз, в котором РЕАЛЬНО лежит сборка
          # под linux-amd64, и ссылку берём из самого релиза, а не склеиваем из номера.
          # 09.08.2026 latest указал на v1.13.17 - релиз только с APK для андроида,
          # ядра там нет, склеенная ссылка вела в никуда, curl молча клал страницу
          # "Not Found" (9 байт) в файл и выходил с кодом 0, а падало всё на распаковке.
          # Флаг prerelease не спасает: ту же неделю бета 1.14.0-beta.11 висела с
          # prerelease=false и была бы "последней версией", поэтому отсекаем и по имени тега.
          curl -fsSL 'https://api.github.com/repos/SagerNet/sing-box/releases?per_page=30' -o /tmp/sb-rel.json
          python3 - > /tmp/sb.env <<'PY'
          import json, re, sys
          for r in json.load(open('/tmp/sb-rel.json')):
              if r['draft'] or r['prerelease'] or re.search(r'alpha|beta|rc', r['tag_name'], re.I):
                  continue
              for a in r['assets']:
                  m = re.fullmatch(r'sing-box-(.+)-linux-amd64\.tar\.gz', a['name'])
                  if m:
                      print('VER=' + m.group(1))
                      print('URL=' + a['browser_download_url'])
                      sys.exit(0)
          sys.exit('среди 30 последних релизов sing-box нет сборки под linux-amd64')
          PY
          . /tmp/sb.env
          echo "sing-box версия: $VER"
          # -f обязателен: без него curl молча кладёт страницу ошибки в файл и выходит с нулём.
          curl -fsSL -o sb.tar.gz "$URL"
          tar -xzf sb.tar.gz --strip-components=1 -C /usr/local/bin "sing-box-${VER}-linux-amd64/sing-box"
          sing-box version

      - name: Собрать наборы
        run: |
          set -e
          mkdir -p dist

          to_json_domains() {
            python3 - "$1" > "$2" <<'PY'
          import json, sys
          items = []
          for line in open(sys.argv[1], encoding='utf-8'):
              s = line.strip()
              if s and not s.startswith('#'):
                  items.append(s)
          json.dump({"version": 3, "rules": [{"domain_suffix": sorted(set(items))}]},
                    sys.stdout, ensure_ascii=False, indent=1)
          PY
          }

          to_json_subnets() {
            python3 - "$1" > "$2" <<'PY'
          import json, sys
          items = []
          for line in open(sys.argv[1], encoding='utf-8'):
              s = line.strip()
              if s and not s.startswith('#'):
                  items.append(s)
          json.dump({"version": 3, "rules": [{"ip_cidr": sorted(set(items))}]},
                    sys.stdout, ensure_ascii=False, indent=1)
          PY
          }

          for f in src/*-domains.lst; do
            n=$(basename "$f" .lst)
            to_json_domains "$f" "dist/$n.json"
            sing-box rule-set compile --output "dist/$n.srs" "dist/$n.json"
            echo "$n: $(grep -cve '^\s*$' "$f") записей -> $(stat -c%s "dist/$n.srs") байт"
          done

          for f in src/*-subnets.lst; do
            n=$(basename "$f" .lst)
            to_json_subnets "$f" "dist/$n.json"
            sing-box rule-set compile --output "dist/$n.srs" "dist/$n.json"
            echo "$n: $(grep -cve '^\s*$' "$f") записей -> $(stat -c%s "dist/$n.srs") байт"
          done

      - name: Собрать рекламный набор
        run: |
          set -e
          # Списки в формате AdGuard, sing-box умеет их конвертировать напрямую.
          # Это то же, что фильтрует AdGuard дома, но применимо на любом устройстве.
          curl -sfL --max-time 120 -o /tmp/ads-src.txt \
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.mini.txt"
          echo "исходник: $(grep -c . /tmp/ads-src.txt) строк"

          # свои правила поверх: то, что мы находили руками и чего нет в общем списке
          cat src/ads-extra.txt >> /tmp/ads-src.txt 2>/dev/null || true

          # белый список: вырезаем блокировки того, что ломает нужные сервисы.
          # Общие списки временами кладут туда боевые домены (gvt2.com у Google Play),
          # и один такой домен выглядит как "интернет сломался", а не как "реклама режется".
          python3 - <<'PY'
          import re, os
          path = 'src/ads-allow.txt'
          allow = set()
          if os.path.exists(path):
              for line in open(path, encoding='utf-8'):
                  s = line.strip().lower()
                  if s and not s.startswith(('#', '!')):
                      allow.add(s)
          lines = open('/tmp/ads-src.txt', encoding='utf-8').read().splitlines()
          keep, dropped = [], []
          for line in lines:
              m = re.match(r'^\|\|([^\^/\$]+)\^?', line.strip())
              d = m.group(1).lower() if m else None
              if d and any(d == a or d.endswith('.' + a) for a in allow):
                  dropped.append(line.strip())
              else:
                  keep.append(line)
          open('/tmp/ads-src.txt', 'w', encoding='utf-8').write('\n'.join(keep) + '\n')
          print(f'белый список: {len(allow)} доменов, вырезано правил {len(dropped)}')
          for l in dropped:
              print('  снято:', l)
          PY

          sing-box rule-set convert --type adguard --output dist/ads.srs /tmp/ads-src.txt
          echo "ads.srs: $(stat -c%s dist/ads.srs) байт"

      - name: Маршрут против рекламы (домен нельзя одновременно гнать и резать)
        run: python3 tools/check-route-conflict.py /tmp/ads-src.txt

      - name: Проверить наборы
        run: |
          set -e
          # Обычные наборы проверяем обратной декомпиляцией И СВЕРКОЙ С ИСХОДНИКОМ.
          # Считать правила бесполезно: все домены лежат в ОДНОМ правиле, поэтому
          # прежняя строка печатала "правил 1" и на полном наборе, и на пустом.
          # Пустой набор (17 байт) уезжал бы в релиз latest, роутер и телефоны забрали
          # бы его по расписанию, и наружу это выглядит как "всё пошло мимо туннеля".
          # Считать записи числом тоже нельзя: sing-box законно склеивает соседние
          # подсети (2001:b28:f23c::/48 + f23d::/48 -> f23c::/47), охват не меняется.
          # Поэтому проверяем ПОКРЫТИЕ: каждая строка исходника обязана попадать в набор.
          for f in dist/main-*.srs; do
            sing-box rule-set decompile --output /tmp/check.json "$f"
            SRC="src/$(basename "$f" .srs).lst" python3 - <<'PY'
          import ipaddress, json, os, sys

          src = []
          for line in open(os.environ['SRC'], encoding='utf-8'):
              t = line.strip()
              if t and not t.startswith('#'):
                  src.append(t)

          suffixes, nets = [], []
          for r in json.load(open('/tmp/check.json')).get('rules', []):
              suffixes += r.get('domain_suffix', [])
              nets += [ipaddress.ip_network(c) for c in r.get('ip_cidr', [])]

          if not suffixes and not nets:
              sys.exit(f'{os.environ["SRC"]}: НАБОР ПУСТ - в него не попало ни одной записи')

          lost = []
          for item in src:
              if '/' in item:
                  n = ipaddress.ip_network(item)
                  ok = any(n.version == m.version and n.subnet_of(m) for m in nets)
              else:
                  ok = any(item == s or item.endswith('.' + s) for s in suffixes)
              if not ok:
                  lost.append(item)

          if lost:
              sys.exit(f'{os.environ["SRC"]}: в набор НЕ попали {len(lost)} записей: ' + ', '.join(lost[:10]))
          print(f'{os.environ["SRC"]}: покрыты все {len(src)} записей '
                f'(в наборе доменов {len(suffixes)}, подсетей {len(nets)})')
          PY
          done

          # Рекламный набор собран из AdGuard-формата и обратно не разбирается -
          # проверяем тем, что sing-box принимает его в живом конфиге.
          cat > /tmp/t.json <<'EOF'
          {
            "log": {"level": "error"},
            "inbounds": [{"type": "socks", "listen": "127.0.0.1", "listen_port": 11999}],
            "outbounds": [{"type": "direct", "tag": "d"}],
            "route": {
              "rules": [{"rule_set": ["ads"], "action": "reject"}],
              "rule_set": [{"type": "local", "tag": "ads", "format": "binary", "path": "PLACEHOLDER"}],
              "final": "d"
            }
          }
          EOF
          sed -i "s|PLACEHOLDER|$(pwd)/dist/ads.srs|" /tmp/t.json
          sing-box check -c /tmp/t.json
          echo "ads.srs: принят sing-box, $(stat -c%s dist/ads.srs) байт"

      - name: Обновить релиз latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Релиз НЕ удаляем: между удалением и созданием файлы недоступны,
          # и потребители в этот момент получают 404. Обновляем файлы на месте.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/*.srs dist/*.json --clobber
            gh release edit latest --notes "Обновлено $(date -u '+%Y-%m-%d %H:%M UTC') из src/"
            echo "релиз обновлён без окна недоступности"
          else
            gh release create latest dist/*.srs dist/*.json \
              --title "latest" \
              --notes "Собрано $(date -u '+%Y-%m-%d %H:%M UTC') из src/"
            echo "релиз создан"
          fi

      - name: Убедиться, что файлы реально отдаются
        run: |
          set -e
          for f in main-domains.srs main-subnets.srs; do
            for i in 1 2 3 4 5; do
              code=$(curl -sL -o /tmp/$f -w '%{http_code}' \
                "https://github.com/${{ github.repository }}/releases/latest/download/$f")
              if [ "$code" = "200" ] && [ -s /tmp/$f ]; then
                echo "$f: отдаётся, $(stat -c%s /tmp/$f) байт"
                break
              fi
              [ $i -eq 5 ] && { echo "$f: НЕ ОТДАЁТСЯ после 5 попыток"; exit 1; }
              sleep 5
            done
          done

      # Предыдущий шаг проверяет github.com, а роутер и телефоны качают с subkv -
      # это разные двери, и зелёный на первой ничего не говорит о второй.
      # Синхронизатор на VPS ходит раз в 20 минут, поэтому не сверяем мгновенно,
      # а ждём: файл у пользователя обязан стать тем же, что мы только что собрали.
      - name: Дождаться, пока правила доедут до пользователя (subkv)
        timeout-minutes: 30
        run: |
          set -e
          BASE="https://subkv.chickenkiller.com/rules"
          FILES="main-domains.srs main-subnets.srs ads.srs"
          for f in $FILES; do
            want=$(sha256sum "dist/$f" | cut -d' ' -f1)
            for i in $(seq 1 27); do
              code=$(curl -sL -o "/tmp/pub-$f" -w '%{http_code}' --max-time 30 "$BASE/$f" || echo 000)
              got=$(sha256sum "/tmp/pub-$f" 2>/dev/null | cut -d' ' -f1)
              if [ "$code" = "200" ] && [ "$want" = "$got" ]; then
                echo "$f: доехал до subkv ($(stat -c%s /tmp/pub-$f) байт, ждали $((i-1)) мин)"
                break
              fi
              if [ "$i" -eq 27 ]; then
                echo "$f: за 26 минут НЕ доехал до subkv (код $code)."
                echo "  ждали sha256 $want, лежит $got"
                echo "  смотреть /opt/sync-rules.sh на VPS - при неудаче он молча оставляет прежнее"
                exit 1
              fi
              sleep 60
            done
          done
